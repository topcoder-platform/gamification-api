paths:
  '/gamification':
    get:
      tags:
        - Health
      description: Get API health status
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Health'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorModel'


definitions:
  Health:
    type: string
    default: 200
  ErrorModel:
    type: object
    properties:
      message:
        type: string
        description: the error message
parameters:
  page:
    name: page
    in: query
    description: The page number.
    required: false
    type: integer
    default: 1
  perPage:
    name: perPage
    in: query
    description: The number of items to list per page.
    required: false
    type: integer
    default: 50
    maximum: 100